plugins { id 'com.android.application' }

android {
    namespace 'com.doxajooon.lifecontrol'
    compileSdk 35

    defaultConfig {
        applicationId 'com.doxajooon.lifecontrol'
        minSdk 26
        targetSdk 35
        versionCode 42
        versionName '42.0'
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.13.0'
}
