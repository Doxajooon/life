plugins { id 'com.android.application' }

android {
    namespace 'com.doxajooon.lifecontrol'
    compileSdk 35

    defaultConfig {
        applicationId 'com.doxajooon.lifecontrol'
        minSdk 26
        targetSdk 35
        versionCode 46
        versionName '46.0'
    }

    buildFeatures { buildConfig true }

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
            details.because 'Keep Kotlin stdlib modules on one compatible version for AndroidX dependencies'
        }
    }
}
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.13.0'
}
