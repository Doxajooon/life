name: Jamal Life Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jamal-life-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Install test tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Static checks
        run: npm test
      - name: End-to-end tests (sync, reminders, UI)
        run: npm run test:e2e

  android:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Copy web app into the Android project
        run: node tools/sync-platforms.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Align and sign APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="app/build/outputs/apk/debug/app-aligned.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$ZIPALIGN" -f 4 "$APK" "$ALIGNED"
          KEYSTORE="$RUNNER_TEMP/jamal-life.keystore"
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "Signing with the persistent keystore from secrets"
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"; PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets: signing with a one-off key (updates over an older APK will need a reinstall)"
            PASS="android"; ALIAS="jamallife"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jamal Life, O=Jamal Life, L=Khujand, C=TJ"
          fi
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
            --out ../JamalLife.apk "$ALIGNED"
          "$APKSIGNER" verify ../JamalLife.apk
          rm -f "$KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: jamal-life-android
          path: JamalLife.apk

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Copy web app into the Windows project
        run: node tools/sync-platforms.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build single-file JamalLife.exe
        run: >
          dotnet publish desktop/JamalLife.Desktop.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish
      - name: Check output
        shell: pwsh
        run: |
          Get-ChildItem publish
          if (-not (Test-Path publish/JamalLife.exe)) { throw "JamalLife.exe was not produced" }
          Copy-Item publish/JamalLife.exe JamalLife.exe
      - uses: actions/upload-artifact@v4
        with:
          name: jamal-life-windows
          path: JamalLife.exe

  release:
    needs: [android, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release with download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v62.1.${{ github.run_number }}
          name: Jamal Life v62.1 (сборка ${{ github.run_number }})
          make_latest: true
          body: |
            **Скачать**
            - Android: `JamalLife.apk`
            - Windows: `JamalLife.exe` (работает из трея, напоминания приходят при закрытом окне)
            - Веб-версия: https://doxajooon.github.io/life/
          files: |
            dist/JamalLife.apk
            dist/JamalLife.exe
