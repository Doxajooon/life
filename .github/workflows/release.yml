name: Life Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # 74.6: build and test jobs only read; the release job below gets write

concurrency:
  group: jamal-life-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Install test tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Static checks
        run: npm test
      - name: AI Edge Function (mocked Deno, Supabase and Gemini)
        run: npm run test:edge
      - name: End-to-end tests (sync, reminders, UI)
        run: npm run test:e2e
      - name: Text contrast on the photo background (4 times of day, both themes)
        run: npm run test:contrast

  android:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Copy web app into the Android project
        run: node tools/sync-platforms.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Align and sign APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="app/build/outputs/apk/debug/app-aligned.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$ZIPALIGN" -f 4 "$APK" "$ALIGNED"
          KEYSTORE="$RUNNER_TEMP/jamal-life.keystore"
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "Signing with the persistent keystore from secrets"
            # secrets pasted on Windows may carry line breaks or spaces: strip them before decoding
            PASS="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"; ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n ')"
            if ! printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$KEYSTORE" 2>/dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — paste the secret again"; exit 1; fi
            if ! keytool -list -keystore "$KEYSTORE" -storepass "$PASS" >/dev/null 2>&1; then
              echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore (wrong password or damaged ANDROID_KEYSTORE_BASE64)"; exit 1; fi
            if ! keytool -list -keystore "$KEYSTORE" -storepass "$PASS" -alias "$ALIAS" >/dev/null 2>&1; then
              echo "::error::ANDROID_KEY_ALIAS '$ALIAS' is not in the keystore"; exit 1; fi
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets: signing with a one-off key (updates over an older APK will need a reinstall)"
            PASS="android"; ALIAS="jamallife"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Life, O=Life"
          fi
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
            --out ../Life.apk "$ALIGNED"
          "$APKSIGNER" verify ../Life.apk
          rm -f "$KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: jamal-life-android
          path: Life.apk

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Copy web app into the Windows project
        run: node tools/sync-platforms.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build single-file Life.exe
        run: >
          dotnet publish desktop/JamalLife.Desktop.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish
      - name: Check output
        shell: pwsh
        run: |
          Get-ChildItem publish
          if (-not (Test-Path publish/Life.exe)) { throw "Life.exe was not produced" }
          Copy-Item publish/Life.exe Life.exe
      - uses: actions/upload-artifact@v4
        with:
          name: jamal-life-windows
          path: Life.exe

  release:
    needs: [android, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: App version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release with download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}.${{ github.run_number }}
          name: Life v${{ steps.ver.outputs.v }} (сборка ${{ github.run_number }})
          make_latest: true
          body: |
            **Скачать**
            - Android: `Life.apk`
            - Windows: `Life.exe` (работает из трея, напоминания приходят при закрытом окне)
            - Веб-версия: https://doxajooon.github.io/life/
          files: |
            dist/Life.apk
            dist/Life.exe
