name: Life Control Release

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'public/**'
      - 'desktop/**'
      - 'desktop-native/**'
      - 'supabase/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - 'VERSION.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-control-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Run static QA
        run: npm test

  android:
    needs: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Align and sign APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="app/build/outputs/apk/debug/app-debug-aligned.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          "$ZIPALIGN" -f 4 "$APK" "$ALIGNED"
          mv "$ALIGNED" "$APK"
          KEYSTORE="$RUNNER_TEMP/life-control.keystore"
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "Signing with persistent keystore from secrets"
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
          else
            echo "No keystore secrets: signing with a one-off debug key"
            PASS="android"
            ALIAS="lifecontrol"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Life Control, OU=Debug, O=Life Control, L=Khujand, ST=Sughd, C=TJ"
          fi
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          rm -f "$KEYSTORE"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: life-control-v56-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
